name: Deploy YOMIO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Verify published YOMIO version
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const source = JSON.parse(fs.readFileSync('package.json','utf8')); const deployed = JSON.parse(fs.readFileSync('dist/version.json','utf8')); if (source.version !== deployed.version) throw new Error('Version mismatch: ' + deployed.version + ' vs ' + source.version); console.log('Published manifest:', deployed.version);"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4